[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyVBRc"
dynamic = ["version"]
authors = [
  { name="Chris Havlin", email="chris.havlin@gmail.com" },
]
description="python utilities for working with the VBRc"
readme = "README.md"
requires-python = ">=3.10"
classifiers=[
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies=["numpy",
              "scipy",
              "matplotlib",
              "packaging",
              "unyt",
 ]
license = "MIT"
license-files = [
    "LICENSE",
]

[tool.setuptools.packages.find]
include = ["pyVBRc*"]

[tool.setuptools.dynamic]
version = {attr = "pyVBRc.__version__"}

[project.urls]
"Homepage" = "https://github.com/vbr-calc/pyVBRc"
"Bug Tracker" = "https://github.com/vbr-calc/pyVBRc/issues"

[dependency-groups]
dev = [
    "pytest>=3",
    "pytest-cov",
    "pre-commit",
]

[tool.check-manifest]
ignore = ["uv.lock"]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E266", "E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E", "F", "W"]
