name: Check lockfile

on: pull_request

permissions:
  contents: read

jobs:
  lock-check:
    name: uv lock --check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
    - name: Check uv.lock is up to date
      run: uv lock --check
