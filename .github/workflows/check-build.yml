name: Build Verification
on: pull_request

jobs:
  build-and-check:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: 3.14
    - name: Build sdist and wheel
      run: uv build
    - name: Twine check
      run: uvx twine check dist/*
