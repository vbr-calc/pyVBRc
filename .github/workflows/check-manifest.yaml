name: check MANIFEST.in
on:
  pull_request

jobs:
  check-manifest:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: 3.14
    - name: run check-manifest
      run: uvx check-manifest -vvv
